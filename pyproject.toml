[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warren-stock-intelligence"
version = "0.4.2"
description = "Reusable stock screening and source-grounded TradingAgents-inspired deep research engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.8,<3.0",
  "yfinance>=0.2.40,<1.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
api = ["uvicorn[standard]>=0.30,<1.0"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1.0"]

[tool.setuptools.packages.find]
include = ["warren*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.vercel]
entrypoint = "app.main:app"
